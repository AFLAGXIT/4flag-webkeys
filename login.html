<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4FLAG CHEAT | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --bg-dark: #0a0a0c; 
            --bg-card: #121216; 
            --border: #27272a; 
            --text-main: #f4f4f5; 
            --text-muted: #a1a1aa; 
            --accent: #ff0000; 
            --accent-hover: #cc0000; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            display: flex; 
            height: 100vh; 
            justify-content: center; 
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        #particles-js {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .login-box { 
            background: rgba(18, 18, 22, 0.85); 
            backdrop-filter: blur(10px);
            border: 1px solid var(--border); 
            padding: 40px; 
            border-radius: 12px; 
            width: 350px; 
            text-align: center; 
            box-shadow: 0 10px 30px rgba(255,0,0,0.1); 
            z-index: 2; 
            position: relative;
        }
        .login-box h1 { 
            font-size: 24px; 
            margin-bottom: 10px; 
            display: flex; 
            justify-content: center; 
            gap: 10px; 
            align-items: center;
            color: var(--accent);
        }
        .login-box p { color: var(--text-muted); font-size: 13px; margin-bottom: 25px; }
        .login-input { 
            width: 100%; 
            padding: 12px; 
            background: var(--bg-dark); 
            border: 1px solid var(--border); 
            color: white; 
            border-radius: 6px; 
            margin-bottom: 15px; 
            outline: none; 
            transition: 0.3s;
        }
        .login-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(255,0,0,0.2);
        }
        .login-btn { 
            width: 100%; 
            padding: 12px; 
            background: var(--accent); 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: 0.2s; 
        }
        .login-btn:hover { background: var(--accent-hover); }
    </style>
</head>
<body>

    <div id="particles-js"></div>

    <div class="login-box">
        <h1><i class="fa-solid fa-shield-halved"></i> 4FLAG CHEAT</h1>
        <p>Please enter admin password to continue</p>
        <input type="password" id="adminLoginPass" class="login-input" placeholder="Enter Admin Password">
        <button class="login-btn" onclick="login()">Login</button>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 60, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#ff0000" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.5, "random": false, "anim": { "enable": false } },
                "size": { "value": 3, "random": true, "anim": { "enable": false } },
                "line_linked": { "enable": true, "distance": 150, "color": "#ff0000", "opacity": 0.4, "width": 1 },
                "move": { "enable": true, "speed": 2, "direction": "none", "random": false, "straight": false, "out_mode": "out", "bounce": false }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": { "onhover": { "enable": true, "mode": "grab" }, "onclick": { "enable": true, "mode": "push" } },
                "modes": { "grab": { "distance": 140, "line_linked": { "opacity": 1 } } }
            },
            "retina_detect": true
        });

        // 7YEDT L' / MN L'AKHIR
        const API_URL = "https://4flagkeys-production-8b1a.up.railway.app";

        function login() {
            const pass = document.getElementById('adminLoginPass').value;
            if (!pass) return alert("Enter password!");

            fetch(`${API_URL}/api/admin/users`, {
                headers: { 'x-admin-password': pass }
            }).then(res => {
                if (res.ok) {
                    localStorage.setItem('adminPassword', pass);
                    window.location.href = 'index.html';
                } else {
                    alert("Wrong Admin Password!");
                }
            }).catch(() => alert("Server error. Make sure the server is running."));
        }
    </script>
</body>
</html>
