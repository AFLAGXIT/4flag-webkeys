<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUTHENTICATION REQUIRED</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --bg-dark: #0a0a0c; 
            --bg-card: #121216; 
            --border: #27272a; 
            --text-main: #f4f4f5; 
            --text-muted: #a1a1aa; 
            --accent: #ff0000; 
            --discord: #5865F2; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            display: flex; 
            height: 100vh; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden; 
            position: relative;
        }

        #particles-js {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .login-box { 
            background: rgba(18, 18, 22, 0.85); 
            backdrop-filter: blur(10px); 
            border: 1px solid var(--border); 
            padding: 40px; 
            border-radius: 12px; 
            width: 400px; 
            text-align: center; 
            box-shadow: 0 10px 30px rgba(255, 0, 0, 0.1); 
            z-index: 2; 
            position: relative;
        }
        .login-box h1 { 
            font-size: 22px; 
            margin-bottom: 10px; 
            color: var(--accent); 
            font-weight: 800; 
            letter-spacing: 1px; 
        }
        .login-box p { color: var(--text-muted); font-size: 13px; margin-bottom: 25px; line-height: 1.5; }
        .discord-btn { 
            width: 100%; 
            padding: 14px; 
            background: var(--discord); 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-weight: 700; 
            font-size: 14px; 
            cursor: pointer; 
            transition: 0.2s; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 10px; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }
        .discord-btn:hover { background: #4752c4; }
        .icon-discord { font-size: 40px; color: var(--accent); margin-bottom: 15px; } 
        .footer-text { font-size: 10px; color: var(--text-muted); margin-top: 20px; font-family: monospace; }
    </style>
</head>
<body>

    <div id="particles-js"></div>

    <div class="login-box">
        <div class="icon-discord"><i class="fa-solid fa-shield-halved"></i></div> 
        <h1>AUTHENTICATION REQUIRED</h1>
        <p>You must authorize with your Discord account to access the ASXXHRAAF dashboard & store.</p>
        <button class="discord-btn" onclick="loginWithDiscord()">
            <i class="fa-brands fa-discord"></i> Connect with Discord
        </button>
        <p class="footer-text">Protected by ASXXHRAAF Security System</p>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 60, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#ff0000" }, 
                "shape": { "type": "circle" },
                "opacity": { "value": 0.5, "random": false, "anim": { "enable": false } },
                "size": { "value": 3, "random": true, "anim": { "enable": false } },
                "line_linked": { "enable": true, "distance": 150, "color": "#ff0000", "opacity": 0.4, "width": 1 },
                "move": { "enable": true, "speed": 2, "direction": "none", "random": false, "straight": false, "out_mode": "out", "bounce": false }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": { "onhover": { "enable": true, "mode": "grab" }, "onclick": { "enable": true, "mode": "push" } },
                "modes": { "grab": { "distance": 140, "line_linked": { "opacity": 1 } } }
            },
            "retina_detect": true
        });

        function loginWithDiscord() {
            const CLIENT_ID = "1568790262409338941";
            const REDIRECT_URI = window.location.origin + "/index.html";
            const OAUTH2_URL = `https://discord.com/oauth2/authorize?client_id=1568790262409338941&response_type=code&redirect_uri=https%3A%2F%2F4flag-webkeys.vercel.app%2Findex.html&scope=identify`;
            
            window.location.href = OAUTH2_URL;
        }
    </script>
</body>
</html>
