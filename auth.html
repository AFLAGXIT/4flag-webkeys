<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUTHENTICATION REQUIRED</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-dark: #0a0a0c; --bg-card: #121216; --border: #27272a; --text-main: #f4f4f5; --text-muted: #a1a1aa; --discord: #5865F2; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: var(--text-main); display: flex; height: 100vh; justify-content: center; align-items: center; overflow: hidden; }
        .login-box { background: rgba(18, 18, 22, 0.85); backdrop-filter: blur(10px); border: 1px solid var(--border); padding: 40px; border-radius: 12px; width: 400px; text-align: center; box-shadow: 0 10px 30px rgba(88, 101, 242, 0.1); }
        .login-box h1 { font-size: 22px; margin-bottom: 10px; color: white; font-weight: 800; letter-spacing: 1px; }
        .login-box p { color: var(--text-muted); font-size: 13px; margin-bottom: 25px; line-height: 1.5; }
        .discord-btn { width: 100%; padding: 14px; background: var(--discord); color: white; border: none; border-radius: 6px; font-weight: 700; font-size: 14px; cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .discord-btn:hover { background: #4752c4; }
        .icon-discord { font-size: 40px; color: var(--discord); margin-bottom: 15px; }
        .footer-text { font-size: 10px; color: var(--text-muted); margin-top: 20px; font-family: monospace; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="icon-discord"><i class="fa-brands fa-discord"></i></div>
        <h1>AUTHENTICATION REQUIRED</h1>
        <p>You must authorize with your Discord account to access the 4FLAG CHEATS dashboard & store.</p>
        <button class="discord-btn" onclick="window.location.href='https://4flagkeys-production-8b1a.up.railway.app/api/auth/discord'">
            <i class="fa-brands fa-discord"></i> Connect with Discord
        </button>
        <p class="footer-text">Protected by 4FLAG Security System</p>
    </div>
</body>
</html>
